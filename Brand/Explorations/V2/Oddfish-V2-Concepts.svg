<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Oddfish abstract logo concepts</title>
  <desc id="desc">Three professional logo directions shown as app icons, wordmarks, and small-size marks.</desc>
  <rect width="1800" height="1040" fill="#F5F4F0"/>

  <text x="110" y="105" fill="#0E1620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="50" font-weight="800" letter-spacing="-1">ODDFISH / IDENTITY V2</text>
  <text x="110" y="154" fill="#56616C" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="23" font-weight="500">Less mascot. More intelligent, ownable and quietly strange.</text>

  <!-- Card 1 -->
  <g transform="translate(90 220)">
    <rect width="500" height="730" rx="34" fill="#FFFFFF"/>
    <rect x="64" y="55" width="372" height="372" rx="84" fill="#0E1620"/>
    <g transform="translate(127 118) scale(2.46)">
      <path d="M61 18H42C28.745 18 18 28.745 18 42v16c0 13.255 10.745 24 24 24h16c13.255 0 24-10.745 24-24V44" fill="none" stroke="#4FE0DD" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="70" y="14" width="17" height="17" rx="4.5" fill="#FF665C" transform="rotate(8 78.5 22.5)"/>
    </g>
    <text x="64" y="500" fill="#0E1620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="29" font-weight="800">01 / OFFSET O</text>
    <text x="64" y="541" fill="#56616C" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="19">The name reduced to one strong gesture.</text>
    <text x="64" y="571" fill="#56616C" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="19">One square refuses to sit where expected.</text>
    <g transform="translate(64 617)">
      <path d="M30.5 9H21C14.373 9 9 14.373 9 21v8c0 6.627 5.373 12 12 12h8c6.627 0 12-5.373 12-12V22" fill="none" stroke="#0E1620" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="35" y="7" width="8.5" height="8.5" rx="2.25" fill="#FF665C" transform="rotate(8 39.25 11.25)"/>
      <text x="68" y="37" fill="#0E1620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Arial Rounded MT Bold', sans-serif" font-size="34" font-weight="900" letter-spacing="4">ODDFISH</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g transform="translate(650 220)">
    <rect width="500" height="730" rx="34" fill="#FFFFFF"/>
    <rect x="64" y="55" width="372" height="372" rx="84" fill="#0E1620"/>
    <g transform="translate(126 112) scale(2.48)">
      <g fill="#4FE0DD">
        <rect x="13" y="15" width="22" height="22" rx="6"/><rect x="39" y="15" width="22" height="22" rx="6"/>
        <rect x="13" y="41" width="22" height="22" rx="6"/><rect x="65" y="41" width="22" height="22" rx="6"/>
        <rect x="13" y="67" width="22" height="22" rx="6"/><rect x="39" y="67" width="22" height="22" rx="6"/><rect x="65" y="67" width="22" height="22" rx="6"/>
      </g>
      <rect x="66" y="9" width="22" height="22" rx="6" fill="#FF665C" transform="rotate(6 77 20)"/>
    </g>
    <text x="64" y="500" fill="#0E1620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="29" font-weight="800">02 / ODD EIGHT</text>
    <text x="64" y="541" fill="#56616C" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="19">Board tiles create a modular letter O.</text>
    <text x="64" y="571" fill="#56616C" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="19">The eighth tile breaks rank—on purpose.</text>
    <g transform="translate(64 614) scale(.5)">
      <g fill="#0E1620">
        <rect x="13" y="15" width="22" height="22" rx="6"/><rect x="39" y="15" width="22" height="22" rx="6"/>
        <rect x="13" y="41" width="22" height="22" rx="6"/><rect x="65" y="41" width="22" height="22" rx="6"/>
        <rect x="13" y="67" width="22" height="22" rx="6"/><rect x="39" y="67" width="22" height="22" rx="6"/><rect x="65" y="67" width="22" height="22" rx="6"/>
      </g>
      <rect x="66" y="9" width="22" height="22" rx="6" fill="#FF665C" transform="rotate(6 77 20)"/>
    </g>
    <text x="126" y="650" fill="#0E1620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Arial Rounded MT Bold', sans-serif" font-size="34" font-weight="900" letter-spacing="4">ODDFISH</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(1210 220)">
    <rect width="500" height="730" rx="34" fill="#FFFFFF"/>
    <rect x="64" y="55" width="372" height="372" rx="84" fill="#0E1620"/>
    <g transform="translate(126 116) scale(2.48)">
      <defs>
        <clipPath id="board-upper"><path d="M0 0h96L0 96Z"/></clipPath>
        <clipPath id="board-lower"><path d="M100 4v96H4Z"/></clipPath>
      </defs>
      <path clip-path="url(#board-upper)" transform="translate(-2 -2)" fill="#4FE0DD" fill-rule="evenodd" d="M12 39c0-14.912 12.088-27 27-27h22c14.912 0 27 12.088 27 27v22c0 14.912-12.088 27-27 27H39c-14.912 0-27-12.088-27-27V39Zm18 2v18c0 6.075 4.925 11 11 11h18c6.075 0 11-4.925 11-11V41c0-6.075-4.925-11-11-11H41c-6.075 0-11 4.925-11 11Z"/>
      <path clip-path="url(#board-lower)" transform="translate(2 2)" fill="#4FE0DD" fill-rule="evenodd" d="M12 39c0-14.912 12.088-27 27-27h22c14.912 0 27 12.088 27 27v22c0 14.912-12.088 27-27 27H39c-14.912 0-27-12.088-27-27V39Zm18 2v18c0 6.075 4.925 11 11 11h18c6.075 0 11-4.925 11-11V41c0-6.075-4.925-11-11-11H41c-6.075 0-11 4.925-11 11Z"/>
      <rect x="48" y="43" width="12" height="12" rx="3" fill="#FF665C" transform="rotate(-45 54 49)"/>
    </g>
    <text x="64" y="500" fill="#0E1620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="29" font-weight="800">03 / SPLIT O</text>
    <text x="64" y="541" fill="#56616C" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="19">A precise form shifted off its own axis.</text>
    <text x="64" y="571" fill="#56616C" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="19">The diagonal adds current without a fish.</text>
    <g transform="translate(64 614) scale(.5)">
      <defs>
        <clipPath id="small-upper"><path d="M0 0h96L0 96Z"/></clipPath>
        <clipPath id="small-lower"><path d="M100 4v96H4Z"/></clipPath>
      </defs>
      <path clip-path="url(#small-upper)" transform="translate(-2 -2)" fill="#0E1620" fill-rule="evenodd" d="M12 39c0-14.912 12.088-27 27-27h22c14.912 0 27 12.088 27 27v22c0 14.912-12.088 27-27 27H39c-14.912 0-27-12.088-27-27V39Zm18 2v18c0 6.075 4.925 11 11 11h18c6.075 0 11-4.925 11-11V41c0-6.075-4.925-11-11-11H41c-6.075 0-11 4.925-11 11Z"/>
      <path clip-path="url(#small-lower)" transform="translate(2 2)" fill="#0E1620" fill-rule="evenodd" d="M12 39c0-14.912 12.088-27 27-27h22c14.912 0 27 12.088 27 27v22c0 14.912-12.088 27-27 27H39c-14.912 0-27-12.088-27-27V39Zm18 2v18c0 6.075 4.925 11 11 11h18c6.075 0 11-4.925 11-11V41c0-6.075-4.925-11-11-11H41c-6.075 0-11 4.925-11 11Z"/>
      <rect x="48" y="43" width="12" height="12" rx="3" fill="#FF665C" transform="rotate(-45 54 49)"/>
    </g>
    <text x="126" y="650" fill="#0E1620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Arial Rounded MT Bold', sans-serif" font-size="34" font-weight="900" letter-spacing="4">ODDFISH</text>
  </g>
</svg>
